{% extends "base.html" %}
{% block body %}
<style>
    .form-page {
        width: min(760px, calc(100% - 32px));
        margin: 24px auto 60px;
    }

    .form-card {
        border: 1px solid #dbe7f3;
        border-radius: 24px;
        background: linear-gradient(145deg, #ffffff 0%, #f4f9ff 100%);
        box-shadow: 0 16px 40px rgba(13, 38, 59, 0.12);
        padding: 30px;
    }

    .form-badge {
        display: inline-block;
        margin-bottom: 14px;
        padding: 6px 12px;
        border-radius: 999px;
        background-color: #103b5d;
        color: #ffffff;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
    }

    .form-title {
        margin: 0 0 8px;
        color: #12263a;
        font-size: 30px;
        line-height: 1.15;
    }

    .form-text {
        margin: 0 0 22px;
        color: #5f7b92;
        font-size: 15px;
    }

    .status-message {
        margin: 0 0 18px;
        padding: 14px 16px;
        border-radius: 16px;
        font-weight: 600;
    }

    .status-message.error {
        background-color: #fff1f1;
        color: #9c2f2f;
        border: 1px solid #f0caca;
    }

    .status-message.success {
        background-color: #eefaf3;
        color: #246844;
        border: 1px solid #c8e8d5;
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
    }

    .form-field {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .form-field.full {
        grid-column: 1 / -1;
    }

    .form-label {
        color: #16324a;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
    }

    .input_field {
        height: 48px;
        padding: 0 16px;
        border: 1px solid #dbe7f3;
        border-radius: 14px;
        background: #ffffff;
        color: #16324a;
        box-shadow: 0 10px 24px rgba(13, 38, 59, 0.08);
        font-size: 15px;
        box-sizing: border-box;
    }

    .input_field:focus {
        outline: none;
        border-color: #8cb8e8;
        box-shadow: 0 0 0 4px rgba(140, 184, 232, 0.2);
    }

    .input_submit {
        margin-top: 20px;
        min-width: 190px;
        height: 48px;
        border: 1px solid #103b5d;
        border-radius: 14px;
        background: linear-gradient(145deg, #103b5d 0%, #1f5d86 100%);
        color: white;
        padding: 0 20px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.04em;
        cursor: pointer;
        box-shadow: 0 16px 32px rgba(16, 59, 93, 0.24);
    }

    @media (max-width: 700px) {
        .form-grid {
            grid-template-columns: 1fr;
        }
    }
</style>

<div class="form-page">
    <div class="form-card">
        <span class="form-badge">Create Boat</span>
        <h1 class="form-title">Add a New Boat</h1>
        <p class="form-text">Use this form to create a new boat record with the same visual style as the rest of the site.</p>

        {% if error %}
            <div class="status-message error">{{ error }}</div>
        {% endif %}

        {% if success %}
            <div class="status-message success">{{ success }}</div>
        {% endif %}

        <form action="/create" method="POST">
            <div class="form-grid">
                <div class="form-field">
                    <label for="id" class="form-label">Boat ID</label>
                    <input id="id" type="number" name="id" placeholder="ID" class="input_field" required>
                </div>

                <div class="form-field">
                    <label for="name" class="form-label">Boat Name</label>
                    <input id="name" type="text" name="name" placeholder="Boat name" class="input_field" required>
                </div>

                <div class="form-field">
                    <label for="type" class="form-label">Boat Type</label>
                    <input id="type" type="text" name="type" placeholder="Boat type" class="input_field" required>
                </div>

                <div class="form-field">
                    <label for="owner_id" class="form-label">Owner ID</label>
                    <input id="owner_id" type="number" name="owner_id" placeholder="Owner ID" class="input_field" required>
                </div>

                <div class="form-field full">
                    <label for="rental_price" class="form-label">Rental Price</label>
                    <input id="rental_price" type="number" name="rental_price" placeholder="Rental price" class="input_field" step="0.01" required>
                </div>
            </div>

            <input type="submit" value="Submit" class="input_submit" required>
        </form>
    </div>
</div>
{% endblock %}
